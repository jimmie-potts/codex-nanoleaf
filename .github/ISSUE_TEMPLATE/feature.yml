name: Feature
description: Define the smallest useful change for the real setup.
labels: [enhancement, 'status:backlog']
body:
  - type: markdown
    attributes:
      value: >-
        Size the story for one operator, the selected installation and its
        registered devices. A small story may answer each prompt in a few
        sentences. See the scope defaults in docs/sdlc.md.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and real setup
      description: State what the user will observe, on which installation and devices, and what is excluded.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Smallest useful implementation
      description: Start from existing components and explicit manual steps. Link prerequisite issues, or state none.
    validations:
      required: true
  - type: textarea
    id: preserve
    attributes:
      label: Behavior and protections to preserve
      description: Name the existing behavior, light-writer ownership, targets, manual control, credentials, and task and scene state that must keep working.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Observable acceptance and planned evidence
      description: List observable scenarios and the automated check or manual observation for each, including any device verification. Choose the delivery target, source-only or including installation and its verification. Installation requires an explicit request and an identified installation owner.
      value: "Delivery target: source-only"
    validations:
      required: true
  - type: textarea
    id: deferrals
    attributes:
      label: Meaningful deferrals
      description: For each meaningful omission, state its consequence or manual alternative and its owning issue or revisit trigger.
      value: None
    validations:
      required: true
  - type: textarea
    id: guide
    attributes:
      label: Guide placement
      description: >-
        The agent-device-hub work guide's ## Guide convention
        (agent-device-hub/docs/work-guide/README.md). Replace <topic id> with
        one of shared-codex, bunny-controls, nanoleaf-presentation,
        nanoleaf-devices, pixoo-media, controls-music, desktop-controls,
        work-guide, assistant-access, hosting-migrations,
        development-workflow. Optional lines: **Note:** a one-line reading
        note, and **Highlight:** next step | decision | later | idea, <reason>.
        Mark a new capability, a generalization or a newly cheap win with
        **Highlight:** idea, <what prompted it>; beside an idea only, add
        **Extends:** <keys> for the stories it builds on, as H67, N47 or P91.
      value: |
        ## Guide

        **Topic:** <topic id>
    validations:
      required: true
