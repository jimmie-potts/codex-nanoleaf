name: Feature
description: Request a feature or a change to an existing behavior.
labels: [enhancement, 'status:backlog']
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the problem and the behavior that would solve it.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what this deliverable includes and its boundaries.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable scenarios that establish completion.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification approach
      description: Name automated checks, manual observations, and any Windows or device verification needed.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link prerequisite issues or state None.
      value: None
    validations:
      required: true
  - type: dropdown
    id: delivery
    attributes:
      label: Delivery target
      description: Installation work requires an explicit request and an identified installation owner.
      options:
        - Source-only
        - Includes installation and its verification
      default: 0
    validations:
      required: true
